name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # ১. অ্যান্ড্রয়েড প্ল্যাটফর্ম ফোল্ডার জেনারেট করা
      - name: Re-generate Android Platform Files
        run: flutter create --platforms=android .

      # ⚡ ২. অটোমেটিক AndroidManifest.xml এ পারমিশন যোগ করা
      - name: Add Storage Permissions to AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>'
          sed -i "/<manifest/a \    $PERMISSIONS" $MANIFEST_PATH

      # ৩. APK বিল্ড করা
      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Music-Player-Android
          path: build/app/outputs/flutter-apk/app-release.apk
