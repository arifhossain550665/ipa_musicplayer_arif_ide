name: iOS Build (Unsigned Archive)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Repository Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (Required for Flutter toolchain)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # ba tumi je version use koro
          channel: 'stable'
          cache: true

      # 4. Get Dependencies & Build Runner
      - name: Install dependencies
        run: |
          flutter pub get

      # 5. Build Unsigned IPA / Archive via Flutter CLI
      - name: Build Unsigned iOS Archive
        run: |
          flutter build ipa --release --no-codesign

      # 6. Upload Artifact
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/archive/Runner.xcarchive
