name: Build IPA & APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════
  # 🤖 Android APK Build
  # ══════════════════════════════════════════════════════════════
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # আপনার নিজের Flutter version বসন
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Ensure Android platform files exist
        run: |
          if [ ! -d "android" ] || [ ! -f "android/app/build.gradle" ]; then
            flutter create . --platforms=android
          fi

      - name: Build APK (release, unsigned)
        run: flutter build apk --release

      - name: Verify APK output
        run: find build/app/outputs/flutter-apk -maxdepth 2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ══════════════════════════════════════════════════════════════
  # 🍎 iOS Unsigned IPA Build
  # ══════════════════════════════════════════════════════════════
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # আপনার নিজের Flutter version বসান
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Ensure iOS platform files exist
        run: |
          if [ ! -d "ios" ] || [ ! -f "ios/Podfile" ]; then
            flutter create . --platforms=ios
          fi

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Clean old Pods
        run: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update

      - name: Force disable code signing in Xcode project
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = .*/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' Runner.xcodeproj/project.pbxproj

      - name: List available schemes (debug)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -list

      - name: Build Unsigned iOS Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=13.0

      - name: Verify archive created
        run: |
          find build/ios/archive -maxdepth 4

      - name: Manually export IPA from Archive (unsigned)
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app not found inside archive!"
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -X Runner-unsigned.ipa Payload
          cd -

      - name: Upload Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive
          path: build/ios/archive/Runner.xcarchive

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/ios/ipa/Runner-unsigned.ipa
