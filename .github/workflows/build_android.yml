name: Build Android APK with JustAudio Support

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # ১. ফ্রেশ অ্যান্ড্রয়েড ফোল্ডার তৈরি
      - name: Recreate Android Folder
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ah.musicplayer --project-name ah_music_player .

      # 🏷️ ২. অ্যাপের নাম "AH Music Player" রাখা
      - name: Set App Name
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label=".*"/android:label="AH Music Player"/' $MANIFEST_PATH

      # ⚡ ৩. MainActivity.kt ফাইলকে AudioServiceActivity দিয়ে রিপ্লেস করা (মূল সমাধান)
      - name: Fix MainActivity Kotlin File
        run: |
          KT_FILE="android/app/src/main/kotlin/com/ah/musicplayer/ah_music_player/MainActivity.kt"
          cat <<EOT > $KT_FILE
          package com.ah.musicplayer.ah_music_player

          import com.ryanheise.audioservice.AudioServiceActivity

          class MainActivity: AudioServiceActivity()
          EOT

      # 🔑 ৪. পারমিশন, AudioServiceActivity এবং JustAudioBackground সার্ভিস Manifest-এ যোগ করা
      - name: Add Permissions and Audio Service to Manifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"

          # 1. Manifest-এ FlutterActivity পরিবর্তন
          sed -i 's/android:name="io.flutter.embedding.android.FlutterActivity"/android:name="com.ryanheise.audioservice.AudioServiceActivity"/' $MANIFEST_PATH

          # 2. Permissions injection
          PERMISSIONS='    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>'
          sed -i "/<manifest/a $PERMISSIONS" $MANIFEST_PATH

          # 3. Background Service Config
          SERVICE_CONFIG='        <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MEDIA_BUTTON" />\n            </intent-filter>\n        </service>'
          sed -i "/<\/activity>/a $SERVICE_CONFIG" $MANIFEST_PATH

      # 🖼️ ৫. কাস্টম আইকন অ্যাপ্লাই করা (যদি assets/app_icon.png থাকে)
      - name: Apply Custom Logo/Icon
        run: |
          if [ -f "assets/app_icon.png" ]; then
            flutter pub add --dev flutter_launcher_icons
            cat <<EOT >> pubspec.yaml

          flutter_launcher_icons:
            android: true
            ios: true
            image_path: "assets/app_icon.png"
          EOT
            flutter pub get
            dart run flutter_launcher_icons
          fi

      # 🛠️ ৬. APK বিল্ড করা
      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: AH-Music-Player-APK
          path: build/app/outputs/flutter-apk/app-release.apk
